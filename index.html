<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>NetSportX TV - Live Sports</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: radial-gradient(circle at 50% 20%, #102a1d 0%, #06130b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .ad-container {
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      overflow: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .brand-title .brand-net { color: #ffffff; }
    .brand-title .brand-accent { color: #00ff73; text-shadow: 0 0 14px rgba(0, 255, 115, 0.4); }
    .brand-title .brand-tv { background: #00e664; color: #06130b; padding: 2px 8px; border-radius: 6px; font-size: 1.1rem; vertical-align: middle; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 68, 68, 0.15);
      border: 1px solid rgba(255, 68, 68, 0.4);
      color: #ff4d4d;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .match-label {
      color: #8be0b2;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    .action-btn {
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #00ff73 0%, #00b34d 100%);
      color: #04180d;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(0, 230, 100, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 10px 0;
    }
    .action-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(0, 230, 100, 0.2);
    }

    .back-btn {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .lang-dropdown {
      width: 100%;
      max-width: 320px;
      padding: 14px 16px;
      background: #092113;
      border: 1px solid #1f5737;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      outline: none;
    }
    .lang-dropdown option { background: #081a10; color: #fff; }

    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .view-section.active { display: flex; }

    .player-wrapper {
      width: 100%;
      max-width: 720px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1f5135;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-wrapper iframe,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    #streamStatusMessage {
      position: absolute;
      color: #00ff73;
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    .sticky-bottom-banner {
      width: 100%;
      position: sticky;
      bottom: 0;
      z-index: 99;
      background: rgba(6, 19, 11, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      padding: 6px 0;
    }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Hls.js latest stable engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>

  <!-- TOP AD BANNER -->
  <div class="ad-container" id="topAdSlot"></div>

  <main class="main-wrapper">

    <!-- SCREEN 1: HOME VIEW -->
    <section id="homeView" class="view-section active">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <div class="live-indicator">
        <span class="live-dot"></span>
        <span>Match Live Now</span>
      </div>

      <div class="match-label" id="homeMatchTitle">Connecting Live Match...</div>

      <button class="action-btn" onclick="goToLanguageView()">WATCH LIVE MATCH</button>
    </section>

    <!-- SCREEN 2: LANGUAGE SELECTOR -->
    <section id="languageView" class="view-section">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <p style="color: #a3cfb4; margin-bottom: 12px; font-size: 0.95rem;">Select Commentary Language:</p>

      <select id="selectedLanguage" class="lang-dropdown">
        <option value="Hindi">Hindi Commentary</option>
        <option value="English">English Commentary</option>
      </select>

      <button class="action-btn" onclick="startStreaming()">CONTINUE TO STREAM</button>
      <button class="back-btn" onclick="goToHomeView()">← Back to Home</button>
    </section>

    <!-- SCREEN 3: STREAM PLAYER -->
    <section id="streamView" class="view-section">
      <div style="display:flex; justify-content: space-between; width: 100%; max-width: 720px; align-items:center; margin-bottom: 10px;">
        <div style="font-weight: 700; color: #00ff73; font-size: 1rem;" id="playerMatchTitle">Live Stream</div>
        <div class="live-indicator" style="margin-bottom: 0;">
          <span class="live-dot"></span> LIVE
        </div>
      </div>

      <div class="player-wrapper">
        <div id="streamStatusMessage">Optimizing Stream...</div>

        <!-- iFrame player (YouTube/Embeds) -->
        <iframe id="videoIframe" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="display:none;"></iframe>
        
        <!-- Live Video Element -->
        <video id="liveVideoPlayer" controls autoplay playsinline style="display:none;"></video>
      </div>

      <!-- MID-PAGE AD BANNER -->
      <div class="ad-container" style="min-height: 60px;"></div>

      <button class="back-btn" style="max-width: 260px;" onclick="goToLanguageView()">← Change Language</button>
      <button class="back-btn" style="max-width: 260px; margin-top: 6px;" onclick="goToHomeView()">⌂ Home</button>
    </section>

  </main>

  <!-- STICKY BOTTOM AD BANNER -->
  <footer class="sticky-bottom-banner">
    <div class="ad-container" id="bottomAdSlot" style="margin: 0; min-height: 60px;"></div>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBjtnl1lVbPf6QwpnB85hZ6ID2woz8RP4",
      authDomain: "netsportxtv.firebaseapp.com",
      databaseURL: "https://netsportxtv-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "netsportxtv",
      storageBucket: "netsportxtv.firebasestorage.app",
      messagingSenderId: "20505178770",
      appId: "1:20505178770:web:a33108e152f4ce0499ec4b",
      measurementId: "G-FH8RTB7WN9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let streamLinks = {
      title: "Live Match",
      hindi: "",
      english: ""
    };

    let hlsInstance = null;

    db.ref("liveStream").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        streamLinks.title = data.title || "Live Sports";
        streamLinks.hindi = data.hindi || "";
        streamLinks.english = data.english || "";

        document.getElementById("homeMatchTitle").innerText = streamLinks.title;
        document.getElementById("playerMatchTitle").innerText = streamLinks.title;
      }
    });

    function showStatus(text, duration = 3000) {
      const el = document.getElementById("streamStatusMessage");
      el.innerText = text;
      el.style.display = "block";
      if (duration > 0) {
        setTimeout(() => { el.style.display = "none"; }, duration);
      }
    }

    function switchScreen(screenId) {
      document.querySelectorAll(".view-section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    function stopAllMedia() {
      const iframe = document.getElementById("videoIframe");
      const video = document.getElementById("liveVideoPlayer");
      const statusEl = document.getElementById("streamStatusMessage");

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      statusEl.style.display = "none";
      iframe.src = "";
      iframe.style.display = "none";
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";
    }

    function goToHomeView() {
      stopAllMedia();
      switchScreen("homeView");
    }

    function goToLanguageView() {
      stopAllMedia();
      switchScreen("languageView");
    }

    // High performance stream proxies capable of routing Akamai/Sony tokens
    const PROXY_PIPELINES = [
      (u) => u, // 1: Direct link (Works on Safari & unblocked networks)
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
      (u) => "https://proxy.cors.sh/" + u,
      (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
    ];

    function playStreamEngine(videoElement, rawTargetUrl) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      let currentPipelineIndex = 0;

      function attemptLoad(pipelineIndex) {
        if (pipelineIndex >= PROXY_PIPELINES.length) {
          // Agar sabhi pipeline fail ho jayein to direct Web Embed Iframe player par route karein
          console.error("All CORS bypass pipelines exhausted. Switching to embed player...");
          showStatus("Routing through alternative player...");
          
          videoElement.style.display = "none";
          const iframe = document.getElementById("videoIframe");
          iframe.style.display = "block";
          
          // Akamai direct web wrapper
          iframe.src = "https://playm3u8.com/index.html?url=" + encodeURIComponent(rawTargetUrl);
          return;
        }

        const formattedUrl = PROXY_PIPELINES[pipelineIndex](rawTargetUrl);
        showStatus(pipelineIndex === 0 ? "Loading Live Stream..." : "Bypassing Security (" + pipelineIndex + ")...");

        if (hlsInstance) {
          hlsInstance.destroy();
        }

        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          xhrSetup: function (xhr, url) {
            xhr.withCredentials = false;
            // API key for proxy.cors.sh
            if (url.includes("cors.sh")) {
              xhr.setRequestHeader("x-cors-api-key", "temp_08c7a67f70b777a83457a41444983088");
            }
          }
        });

        hlsInstance.loadSource(formattedUrl);
        hlsInstance.attachMedia(videoElement);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          document.getElementById("streamStatusMessage").style.display = "none";
          videoElement.play().catch(e => {
            console.log("Autoplay paused. Click play button.", e);
          });
        });

        // Smart Failover on Network 403 or CORS Block
        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.warn("Pipeline " + pipelineIndex + " blocked or failed (" + data.type + "). Switching pipeline...");
            hlsInstance.destroy();
            hlsInstance = null;
            attemptLoad(pipelineIndex + 1);
          }
        });
      }

      // Start pipeline
      if (Hls.isSupported()) {
        attemptLoad(0);
      } else if (videoElement.canPlayType("application/vnd.apple.mpegurl")) {
        // iOS Safari native player (Akamai origin issues nahi deta)
        videoElement.src = rawTargetUrl;
        videoElement.play().catch(e => console.log(e));
      } else {
        const iframe = document.getElementById("videoIframe");
        iframe.style.display = "block";
        iframe.src = "https://playm3u8.com/index.html?url=" + encodeURIComponent(rawTargetUrl);
      }
    }

    function startStreaming() {
      const selected = document.getElementById("selectedLanguage").value;
      const targetUrl = (selected === "Hindi") ? streamLinks.hindi : streamLinks.english;

      if (!targetUrl) {
        alert("Selected stream link abhi available nahi hai. Kripya doosri language chunein.");
        return;
      }

      stopAllMedia();

      const iframe = document.getElementById("videoIframe");
      const video = document.getElementById("liveVideoPlayer");

      if (targetUrl.includes(".m3u8") || targetUrl.includes(".mpd")) {
        video.style.display = "block";
        playStreamEngine(video, targetUrl.trim());
      } else {
        // Embed links (Crichd, YouTube, etc.)
        let finalUrl = targetUrl.trim();
        if (finalUrl.includes("watch?v=")) {
          finalUrl = finalUrl.replace("watch?v=", "embed/");
        }
        iframe.style.display = "block";
        iframe.src = finalUrl;
      }

      switchScreen("streamView");
    }
  </script>
</body>
</html>
