<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>NetSportX TV - Live Sports</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: radial-gradient(circle at 50% 20%, #102a1d 0%, #06130b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .ad-container {
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      overflow: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .brand-title .brand-net { color: #ffffff; }
    .brand-title .brand-accent { color: #00ff73; text-shadow: 0 0 14px rgba(0, 255, 115, 0.4); }
    .brand-title .brand-tv { background: #00e664; color: #06130b; padding: 2px 8px; border-radius: 6px; font-size: 1.1rem; vertical-align: middle; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 68, 68, 0.15);
      border: 1px solid rgba(255, 68, 68, 0.4);
      color: #ff4d4d;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .match-label {
      color: #8be0b2;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    .action-btn {
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #00ff73 0%, #00b34d 100%);
      color: #04180d;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(0, 230, 100, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 10px 0;
    }
    .action-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(0, 230, 100, 0.2);
    }

    .back-btn {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .lang-dropdown {
      width: 100%;
      max-width: 320px;
      padding: 14px 16px;
      background: #092113;
      border: 1px solid #1f5737;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      outline: none;
    }
    .lang-dropdown option { background: #081a10; color: #fff; }

    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .view-section.active { display: flex; }

    .player-wrapper {
      width: 100%;
      max-width: 720px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1f5135;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-wrapper iframe,
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    #streamAlertBox {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #ff4444;
      color: #ffb3b3;
      padding: 12px 18px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      max-width: 90%;
      display: none;
      z-index: 10;
    }

    .sticky-bottom-banner {
      width: 100%;
      position: sticky;
      bottom: 0;
      z-index: 99;
      background: rgba(6, 19, 11, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      padding: 6px 0;
    }
  </style>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <!-- HLS.js Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  
  <!-- Shaka Player for DASH .mpd -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
</head>
<body>

  <div class="ad-container" id="topAdSlot"></div>

  <main class="main-wrapper">

    <!-- SCREEN 1: HOME VIEW -->
    <section id="homeView" class="view-section active">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <div class="live-indicator">
        <span class="live-dot"></span>
        <span>Match Live Now</span>
      </div>

      <div class="match-label" id="homeMatchTitle">Connecting Live Match...</div>

      <button class="action-btn" onclick="goToLanguageView()">WATCH LIVE MATCH</button>
    </section>

    <!-- SCREEN 2: LANGUAGE SELECTOR -->
    <section id="languageView" class="view-section">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <p style="color: #a3cfb4; margin-bottom: 12px; font-size: 0.95rem;">Select Commentary Language:</p>

      <select id="selectedLanguage" class="lang-dropdown">
        <option value="Hindi">Hindi Commentary</option>
        <option value="English">English Commentary</option>
      </select>

      <button class="action-btn" onclick="startStreaming()">CONTINUE TO STREAM</button>
      <button class="back-btn" onclick="goToHomeView()">← Back to Home</button>
    </section>

    <!-- SCREEN 3: STREAM PLAYER -->
    <section id="streamView" class="view-section">
      <div style="display:flex; justify-content: space-between; width: 100%; max-width: 720px; align-items:center; margin-bottom: 10px;">
        <div style="font-weight: 700; color: #00ff73; font-size: 1rem;" id="playerMatchTitle">Live Stream</div>
        <div class="live-indicator" style="margin-bottom: 0;">
          <span class="live-dot"></span> LIVE
        </div>
      </div>

      <div class="player-wrapper">
        <div id="streamAlertBox"></div>
        <iframe id="videoIframe" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" style="display:none;"></iframe>
        <video id="liveVideoPlayer" controls autoplay playsinline style="display:none;"></video>
      </div>

      <div class="ad-container" style="min-height: 60px;"></div>

      <button class="back-btn" style="max-width: 260px;" onclick="goToLanguageView()">← Change Language</button>
      <button class="back-btn" style="max-width: 260px; margin-top: 6px;" onclick="goToHomeView()">⌂ Home</button>
    </section>

  </main>

  <footer class="sticky-bottom-banner">
    <div class="ad-container" id="bottomAdSlot" style="margin: 0; min-height: 60px;"></div>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBjtnl1lVbPf6QwpnB85hZ6ID2woz8RP4",
      authDomain: "netsportxtv.firebaseapp.com",
      databaseURL: "https://netsportxtv-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "netsportxtv",
      storageBucket: "netsportxtv.firebasestorage.app",
      messagingSenderId: "20505178770",
      appId: "1:20505178770:web:a33108e152f4ce0499ec4b",
      measurementId: "G-FH8RTB7WN9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let streamLinks = {
      title: "Live Match",
      hindi: "",
      english: ""
    };

    let hlsInstance = null;
    let shakaInstance = null;

    if (window.shaka) {
      shaka.polyfill.installAll();
    }

    db.ref("liveStream").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        streamLinks.title = data.title || "Live Sports";
        streamLinks.hindi = data.hindi || "";
        streamLinks.english = data.english || "";

        document.getElementById("homeMatchTitle").innerText = streamLinks.title;
        document.getElementById("playerMatchTitle").innerText = streamLinks.title;
      }
    });

    function showNotice(msg) {
      const box = document.getElementById("streamAlertBox");
      box.innerText = msg;
      box.style.display = "block";
    }

    function switchScreen(screenId) {
      document.querySelectorAll(".view-section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    async function stopAllMedia() {
      const iframe = document.getElementById("videoIframe");
      const video = document.getElementById("liveVideoPlayer");
      const box = document.getElementById("streamAlertBox");

      box.style.display = "none";

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (shakaInstance) {
        try {
          await shakaInstance.destroy();
        } catch (e) {}
        shakaInstance = null;
      }

      iframe.src = "";
      iframe.style.display = "none";
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";
    }

    function goToHomeView() {
      stopAllMedia();
      switchScreen("homeView");
    }

    function goToLanguageView() {
      stopAllMedia();
      switchScreen("languageView");
    }

    // Proxy Rotator for bypassing 403 blocks
    const PROXY_OPTIONS = [
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
      (u) => "https://corsproxy.io/?" + encodeURIComponent(u),
      (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
      (u) => u
    ];

    // Helper: Decode Base64 if stream link is encoded
    function resolveTargetUrl(rawUrl) {
      try {
        if (rawUrl.includes("lovable.app/") && !rawUrl.includes("http", 15)) {
          const parts = rawUrl.split("lovable.app/")[1].split("?")[0];
          const decoded = atob(parts);
          if (decoded.startsWith("http")) return decoded;
        }
      } catch (e) {}
      return rawUrl;
    }

    // 1. DASH Stream (.mpd)
    async function playDashEngine(videoElement, streamUrl) {
      if (!shaka.Player.isBrowserSupported()) {
        showNotice("Browser does not support DASH streaming.");
        return;
      }

      shakaInstance = new shaka.Player();
      await shakaInstance.attach(videoElement);

      shakaInstance.getNetworkingEngine().registerRequestFilter((type, request) => {
        let uri = request.uris[0];
        if (!uri.includes("allorigins") && !uri.includes("corsproxy")) {
          request.uris[0] = PROXY_OPTIONS[0](uri);
        }
      });

      try {
        await shakaInstance.load(streamUrl);
        videoElement.play().catch(e => console.log(e));
      } catch (err) {
        console.error("DASH error:", err);
        showNotice("Stream Blocked: Token expire ya DRM issue hai.");
      }
    }

    // 2. Resilient HLS Stream Engine with Dynamic Failover
    function playHlsEngine(videoElement, rawUrl) {
      let currentProxyIndex = 0;
      let networkRetryCount = 0;

      function loadWithCurrentProxy() {
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }

        const activeProxyUrl = PROXY_OPTIONS[currentProxyIndex](rawUrl);

        if (Hls.isSupported()) {
          hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            manifestLoadingTimeOut: 10000,
            xhrSetup: function (xhr) {
              xhr.withCredentials = false;
            }
          });

          // Ensure segments also follow proxy
          hlsInstance.on(Hls.Events.LEVEL_LOADED, function (event, data) {
            if (data.details && data.details.fragments) {
              data.details.fragments.forEach(frag => {
                if (frag.url && !frag.url.startsWith("http")) {
                  const base = activeProxyUrl.substring(0, activeProxyUrl.lastIndexOf('/') + 1);
                  frag.url = base + frag.url;
                }
              });
            }
          });

          hlsInstance.loadSource(activeProxyUrl);
          hlsInstance.attachMedia(videoElement);

          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
            networkRetryCount = 0;
            videoElement.play().catch(e => console.log("User play required:", e));
          });

          // Handled Error Recovery
          hlsInstance.on(Hls.Events.ERROR, function (e, data) {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  if (networkRetryCount < 2) {
                    networkRetryCount++;
                    console.warn("Network error encountered, retrying...", data);
                    hlsInstance.startLoad();
                  } else {
                    // Try next proxy option
                    currentProxyIndex++;
                    if (currentProxyIndex < PROXY_OPTIONS.length) {
                      console.warn("Proxy failed, switching to backup proxy #" + currentProxyIndex);
                      networkRetryCount = 0;
                      loadWithCurrentProxy();
                    } else {
                      hlsInstance.destroy();
                      showNotice("Stream Blocked: Token expire ho chuka hai ya Origin server ne block kar diya hai.");
                    }
                  }
                  break;

                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.warn("Media error encountered, attempting recovery...", data);
                  hlsInstance.recoverMediaError();
                  break;

                default:
                  hlsInstance.destroy();
                  showNotice("Stream play nahi ho saki. Please doosri link try karein.");
                  break;
              }
            }
          });

        } else if (videoElement.canPlayType("application/vnd.apple.mpegurl")) {
          videoElement.src = activeProxyUrl;
          videoElement.play().catch(e => console.log(e));
        }
      }

      loadWithCurrentProxy();
    }

    async function startStreaming() {
      const selected = document.getElementById("selectedLanguage").value;
      const originalInput = (selected === "Hindi") ? streamLinks.hindi : streamLinks.english;

      if (!originalInput) {
        alert("Selected stream link abhi available nahi hai. Kripya doosri language chunein.");
        return;
      }

      await stopAllMedia();

      const iframe = document.getElementById("videoIframe");
      const video = document.getElementById("liveVideoPlayer");
      
      const cleanUrl = resolveTargetUrl(originalInput.trim());

      // 1. DASH Stream
      if (cleanUrl.includes(".mpd")) {
        video.style.display = "block";
        await playDashEngine(video, cleanUrl);
      } 
      // 2. HLS Manifest Stream (.m3u8, .txt playlists)
      else if (cleanUrl.includes(".m3u8") || cleanUrl.includes(".txt") || cleanUrl.includes("/hls/")) {
        video.style.display = "block";
        playHlsEngine(video, cleanUrl);
      } 
      // 3. Regular Iframe / Web Embeds
      else {
        let finalUrl = cleanUrl;
        if (finalUrl.includes("watch?v=")) {
          finalUrl = finalUrl.replace("watch?v=", "embed/");
        }
        iframe.style.display = "block";
        iframe.src = finalUrl;
      }

      switchScreen("streamView");
    }
  </script>
</body>
</html>
