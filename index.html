<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>NetSportX TV - Live Sports</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body {
      background: radial-gradient(circle at 50% 20%, #102a1d 0%, #06130b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Ad Banner Slots */
    .ad-container {
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      overflow: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    /* Branding Header */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .brand-title .brand-net { color: #ffffff; }
    .brand-title .brand-accent { color: #00ff73; text-shadow: 0 0 14px rgba(0, 255, 115, 0.4); }
    .brand-title .brand-tv { background: #00e664; color: #06130b; padding: 2px 8px; border-radius: 6px; font-size: 1.1rem; vertical-align: middle; }

    /* Live Badge */
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 68, 68, 0.15);
      border: 1px solid rgba(255, 68, 68, 0.4);
      color: #ff4d4d;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff3b3b;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .match-label {
      color: #8be0b2;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #00ff73 0%, #00b34d 100%);
      color: #04180d;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(0, 230, 100, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 10px 0;
    }
    .action-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(0, 230, 100, 0.2);
    }

    .back-btn {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    /* Dropdown */
    .lang-dropdown {
      width: 100%;
      max-width: 320px;
      padding: 14px 16px;
      background: #092113;
      border: 1px solid #1f5737;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      outline: none;
    }
    .lang-dropdown option { background: #081a10; color: #fff; }

    /* Views */
    .view-section {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .view-section.active { display: flex; }

    /* Player Container */
    .player-wrapper {
      width: 100%;
      max-width: 720px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1f5135;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-wrapper video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    #streamAlertBox {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #ff4444;
      color: #ffb3b3;
      padding: 12px 18px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      max-width: 90%;
      display: none;
      z-index: 10;
    }

    /* Sticky Footer */
    .sticky-bottom-banner {
      width: 100%;
      position: sticky;
      bottom: 0;
      z-index: 99;
      background: rgba(6, 19, 11, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      padding: 6px 0;
    }
  </style>

  <!-- Firebase Compat SDKs (Direct Browser Support) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

  <!-- Shaka Player CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
</head>
<body>

  <!-- Top Banner Slot -->
  <div class="ad-container" id="topAdSlot"></div>

  <main class="main-wrapper">

    <!-- Screen 1: Home View -->
    <section id="homeView" class="view-section active">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <div class="live-indicator">
        <span class="live-dot"></span>
        <span>Match Live Now</span>
      </div>

      <div class="match-label" id="homeMatchTitle">Connecting Live Match...</div>

      <button class="action-btn" onclick="goToLanguageView()">WATCH LIVE MATCH</button>
    </section>

    <!-- Screen 2: Language Selector -->
    <section id="languageView" class="view-section">
      <div class="brand-title">
        <span class="brand-net">NetSport</span><span class="brand-accent">X</span>
        <span class="brand-tv">TV</span>
      </div>

      <p style="color: #a3cfb4; margin-bottom: 12px; font-size: 0.95rem;">Select Commentary Language:</p>

      <select id="selectedLanguage" class="lang-dropdown">
